name: tracop_mobile
description: Aplicación móvil de TRACOP - abastecimiento agropecuario.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.7
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.1
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  uuid: ^4.4.0
  intl: any
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0
  drift_flutter: ^0.3.1

  flutter_web_plugins:
    sdk: flutter
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.23.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/legal/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
