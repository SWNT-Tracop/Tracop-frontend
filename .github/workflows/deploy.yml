name: Deploy (CD)

# Cada merge a main compila el APK (Android) y la versión web, y publica el APK como
# artefacto y como GitHub Release `build-<n>`. No sube a AWS desde GitHub Actions: en
# Learner Lab no hay IAM para eso. La web se sincroniza a S3 a mano (ver abajo).
#
# Variables (Settings → Secrets and variables → Actions → Variables):
#   API_BASE_URL             → URL del backend desplegado (https://…)
#   PRIVACY_POLICY_VERSION   → versión vigente del aviso (la misma que la API); por defecto v0-draft
#
# Secretos (Settings → Secrets and variables → Actions → Secrets), para firmar siempre con la
# misma clave y que Android acepte cada APK nuevo encima del anterior:
#   ANDROID_KEYSTORE_BASE64  → el archivo .jks en base64 (base64 -w0 tracop-release.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK and Web
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      PRIVACY_POLICY_VERSION: ${{ vars.PRIVACY_POLICY_VERSION || 'v0-draft' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use the runner's Java 17 for Gradle
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # pinned commit
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache-key: ${{ runner.os }}-pub

      - name: Check build configuration
        run: |
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "API_BASE_URL must be an https URL (repository variable)."; exit 1 ;;
          esac

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Write the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/tracop-release.jks
          {
            echo "storeFile=tracop-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK (release)
        run: >-
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=PRIVACY_POLICY_VERSION="$PRIVACY_POLICY_VERSION"

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f android/tracop-release.jks android/key.properties

      - name: Build Web (release)
        run: >-
          flutter build web --release
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=PRIVACY_POLICY_VERSION="$PRIVACY_POLICY_VERSION"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tracop-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tracop-web
          path: build/web
          retention-days: 14

  release-apk:
    name: Publish APK release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tracop-android
          path: build

      - name: Name the APK after the build
        run: mv build/app-release.apk "build/tracop-build-${{ github.run_number }}.apk"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TRACOP build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: build/tracop-build-${{ github.run_number }}.apk
          generate_release_notes: true

# Sincronizar la web a S3 (manual, desde tu máquina con las credenciales del lab):
#   flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"
#   aws s3 sync build/web s3://"$WEB_BUCKET" --delete
# WEB_BUCKET sale de `terraform output -raw web_bucket` en el repo del backend.
